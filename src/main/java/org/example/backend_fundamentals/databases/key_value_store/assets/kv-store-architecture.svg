<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Distributed key-value store architecture</title>
  <desc id="desc">Clients talk to coordinator nodes. Keys are routed through consistent hashing to replicated storage nodes. Nodes use commit log, memtable, SSTables, Bloom filters, gossip, and anti-entropy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .store { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 8; }
      .ops { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 8; }
      .text { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>

  <rect x="35" y="130" width="120" height="72" class="box"/>
  <text x="95" y="162" text-anchor="middle" class="text">Client</text>
  <text x="95" y="184" text-anchor="middle" class="small">get / put</text>

  <path d="M155 166 H225" class="arrow"/>

  <rect x="235" y="115" width="170" height="102" class="box"/>
  <text x="320" y="148" text-anchor="middle" class="text">Coordinator</text>
  <text x="320" y="172" text-anchor="middle" class="small">routes key</text>
  <text x="320" y="192" text-anchor="middle" class="small">waits for R/W quorum</text>

  <path d="M405 166 H480" class="arrow"/>

  <rect x="490" y="40" width="145" height="76" class="store"/>
  <text x="562" y="72" text-anchor="middle" class="text">Node A</text>
  <text x="562" y="94" text-anchor="middle" class="small">replica 1</text>

  <rect x="650" y="140" width="145" height="76" class="store"/>
  <text x="722" y="172" text-anchor="middle" class="text">Node B</text>
  <text x="722" y="194" text-anchor="middle" class="small">replica 2</text>

  <rect x="490" y="245" width="145" height="76" class="store"/>
  <text x="562" y="277" text-anchor="middle" class="text">Node C</text>
  <text x="562" y="299" text-anchor="middle" class="small">replica 3</text>

  <path d="M482 157 C500 120, 520 95, 548 116" class="arrow"/>
  <path d="M480 166 H650" class="arrow"/>
  <path d="M482 176 C505 220, 520 242, 548 245" class="arrow"/>

  <rect x="825" y="82" width="120" height="192" class="ops"/>
  <text x="885" y="116" text-anchor="middle" class="text">Node internals</text>
  <text x="885" y="145" text-anchor="middle" class="small">commit log</text>
  <text x="885" y="168" text-anchor="middle" class="small">memtable</text>
  <text x="885" y="191" text-anchor="middle" class="small">SSTables</text>
  <text x="885" y="214" text-anchor="middle" class="small">Bloom filter</text>
  <text x="885" y="237" text-anchor="middle" class="small">Merkle tree</text>

  <path d="M795 178 H815" class="dash"/>
  <text x="590" y="350" text-anchor="middle" class="small">Consistent hashing chooses replicas; gossip detects node failure; hinted handoff and anti-entropy repair missed writes.</text>
</svg>
