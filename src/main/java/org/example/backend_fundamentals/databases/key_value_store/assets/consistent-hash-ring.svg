<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Consistent hashing ring with virtual nodes</title>
  <desc id="desc">Keys and virtual nodes are placed on the same hash ring. A key belongs to the first virtual node clockwise.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .ring { fill: none; stroke: #334155; stroke-width: 4; }
      .nodeA { fill: #0891b2; }
      .nodeB { fill: #ca8a04; }
      .nodeC { fill: #16a34a; }
      .key { fill: #e11d48; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>

  <circle cx="380" cy="245" r="170" class="ring"/>
  <path d="M520 150 A170 170 0 0 1 550 245" class="arrow"/>
  <text x="548" y="140" class="small">clockwise lookup</text>

  <circle cx="380" cy="75" r="13" class="nodeA"/><text x="398" y="80" class="text">A1</text>
  <circle cx="524" cy="154" r="13" class="nodeB"/><text x="542" y="160" class="text">B1</text>
  <circle cx="524" cy="336" r="13" class="nodeC"/><text x="542" y="342" class="text">C1</text>
  <circle cx="380" cy="415" r="13" class="nodeB"/><text x="398" y="420" class="text">B2</text>
  <circle cx="236" cy="336" r="13" class="nodeA"/><text x="182" y="342" class="text">A2</text>
  <circle cx="236" cy="154" r="13" class="nodeC"/><text x="182" y="160" class="text">C2</text>

  <circle cx="470" cy="105" r="8" class="key"/><text x="485" y="108" class="text">key:profile:42</text>
  <path d="M470 105 C500 115, 515 130, 524 154" class="arrow"/>

  <rect x="40" y="40" width="190" height="110" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="8"/>
  <text x="60" y="70" class="text">Legend</text>
  <circle cx="72" cy="96" r="8" class="nodeA"/><text x="90" y="101" class="small">physical node A vnode</text>
  <circle cx="72" cy="120" r="8" class="nodeB"/><text x="90" y="125" class="small">physical node B vnode</text>
  <circle cx="72" cy="144" r="8" class="key"/><text x="90" y="149" class="small">hashed key</text>

  <text x="380" y="465" text-anchor="middle" class="small">More virtual nodes smooth distribution and let powerful servers own more ring positions.</text>
</svg>
