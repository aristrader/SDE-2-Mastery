<svg xmlns="http://www.w3.org/2000/svg" width="540" height="820" viewBox="0 0 540 820" role="img" aria-labelledby="title desc">
  <title id="title">Distributed exact top-K reduction</title>
  <desc id="desc">Independent stream shards emit compact local candidate lists. A global merger produces the final top-K snapshot.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#334155"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:700}.body{font-size:16px}.box{stroke:#334155;stroke-width:2.5;rx:9}.arrow{stroke:#334155;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="540" height="820" fill="#f8fafc"/>
  <text x="270" y="45" text-anchor="middle" class="title">Exact distributed top K</text>
  <text x="270" y="72" text-anchor="middle" class="body">Reduce candidates, not every item count.</text>
  <rect x="55" y="110" width="430" height="70" class="box" fill="#dbeafe"/><text x="270" y="153" text-anchor="middle" class="label">Shard A owns item-ID range A</text>
  <rect x="55" y="205" width="430" height="70" class="box" fill="#dbeafe"/><text x="270" y="248" text-anchor="middle" class="label">Shard B owns item-ID range B</text>
  <rect x="55" y="300" width="430" height="70" class="box" fill="#dbeafe"/><text x="270" y="343" text-anchor="middle" class="label">Shard C and remaining shards</text>
  <path d="M485 145 H515 V440 H485" fill="none" class="arrow"/>
  <path d="M485 240 H505 V465 H485" fill="none" class="arrow"/>
  <path d="M485 335 H495 V490 H485" fill="none" class="arrow"/>
  <rect x="55" y="420" width="430" height="110" class="box" fill="#dcfce7"/>
  <text x="270" y="462" text-anchor="middle" class="label">Local candidate selection</text><text x="270" y="490" text-anchor="middle" class="body">each shard emits local top M, where M &gt;= K</text>
  <line x1="270" y1="530" x2="270" y2="578" class="arrow"/>
  <rect x="55" y="578" width="430" height="105" class="box" fill="#fef3c7"/>
  <text x="270" y="619" text-anchor="middle" class="label">Global merger</text><text x="270" y="647" text-anchor="middle" class="body">min-heap of size K over all candidates</text>
  <line x1="270" y1="683" x2="270" y2="731" class="arrow"/>
  <rect x="55" y="731" width="430" height="68" class="box" fill="#fee2e2"/>
  <text x="270" y="773" text-anchor="middle" class="label">Ranked TopKSnapshot for cache and API</text>
</svg>
