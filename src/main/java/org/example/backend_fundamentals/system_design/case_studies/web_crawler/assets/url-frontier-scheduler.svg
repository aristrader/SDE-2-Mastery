<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">URL frontier chooses eligible hosts</title>
  <desc id="desc">Priority queues select candidates. Host-key partitions persist each host backlog. Active hosts appear in a heap ordered by next allowed time; only its due head reaches a worker, which fetches one URL and reschedules the host.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#334155"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.front{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:8}.host{fill:#f0fdf4;stroke:#15803d;stroke-width:2;rx:8}.store{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:8}.work{fill:#f8fafc;stroke:#475569;stroke-width:2;rx:8}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#475569}.section{font-size:19px;font-weight:800}</style>
  </defs>
  <text x="45" y="40" class="section">1. Choose priority without starving discovery</text>
  <rect x="45" y="66" width="150" height="52" class="front"/><text x="120" y="98" text-anchor="middle" class="label">High / due</text>
  <rect x="45" y="137" width="150" height="52" class="front"/><text x="120" y="169" text-anchor="middle" class="label">Normal</text>
  <rect x="45" y="208" width="150" height="52" class="front"/><text x="120" y="240" text-anchor="middle" class="label">Discovery</text>
  <rect x="270" y="126" width="170" height="72" class="work"/><text x="355" y="155" text-anchor="middle" class="label">Weighted selector</text><text x="355" y="177" text-anchor="middle" class="small">priority + freshness</text>
  <rect x="515" y="126" width="165" height="72" class="work"/><text x="598" y="155" text-anchor="middle" class="label">Host-key owner</text><text x="598" y="177" text-anchor="middle" class="small">hash(hostKey)</text>
  <path d="M195 92 L270 145" class="line"/><path d="M195 163 L270 162" class="line"/><path d="M195 234 L270 180" class="line"/><path d="M440 162 L515 162" class="line"/>
  <text x="45" y="319" class="section">2. Persist host work; dispatch only the due heap head</text>
  <rect x="45" y="350" width="190" height="72" class="store"/><text x="140" y="380" text-anchor="middle" class="label">Host A backlog</text><text x="140" y="402" text-anchor="middle" class="small">nextAllowed 10:01</text>
  <rect x="275" y="350" width="190" height="72" class="store"/><text x="370" y="380" text-anchor="middle" class="label">Host B backlog</text><text x="370" y="402" text-anchor="middle" class="small">nextAllowed 10:03</text>
  <rect x="545" y="350" width="175" height="72" class="host"/><text x="633" y="380" text-anchor="middle" class="label">Active-host heap</text><text x="633" y="402" text-anchor="middle" class="small">ordered by nextAllowed</text>
  <rect x="790" y="350" width="130" height="72" class="work"/><text x="855" y="380" text-anchor="middle" class="label">Worker</text><text x="855" y="402" text-anchor="middle" class="small">lease + fetch one</text>
  <path d="M598 198 C598 265 140 275 140 350" class="line"/><path d="M598 198 C598 265 370 275 370 350" class="line"/><path d="M235 386 L545 386" class="line"/><path d="M465 402 L545 402" class="line"/><path d="M720 386 L790 386" class="line"/><path d="M855 422 C855 490 633 490 633 422" class="line"/>
</svg>
