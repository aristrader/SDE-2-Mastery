<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="title desc">
  <title id="title">File-sync architecture with separate control, data, and sync planes</title>
  <desc id="desc">The API and metadata database control authorization and versions. Devices transfer bytes directly with object storage. A durable change feed and notifications let other devices synchronize.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; font-size: 18px; }
    .title { font-size: 24px; font-weight: 700; }
    .box { stroke: #475569; stroke-width: 2; rx: 8; }
    .api { fill: #dbeafe; } .storage { fill: #dcfce7; } .data { fill: #fce7f3; } .event { fill: #fef3c7; }
    .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 7 5; } .label { font-size: 15px; fill: #475569; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
  <text x="24" y="36" class="title">File sync: control, data, and change planes</text>

  <rect x="28" y="92" width="132" height="82" class="box api"/>
  <text x="57" y="126">Device A</text><text x="47" y="150" class="label">watcher + cache</text>
  <rect x="228" y="80" width="160" height="106" class="box api"/>
  <text x="255" y="119">API service</text><text x="246" y="145" class="label">auth, versions,</text><text x="249" y="166" class="label">upload intent</text>
  <rect x="465" y="80" width="160" height="106" class="box storage"/>
  <text x="487" y="119">Object storage</text><text x="493" y="145" class="label">direct multipart</text><text x="500" y="166" class="label">file bytes</text>

  <rect x="228" y="286" width="160" height="92" class="box data"/>
  <text x="252" y="324">Metadata DB</text><text x="244" y="348" class="label">files, versions,</text><text x="244" y="369" class="label">permissions</text>
  <rect x="465" y="286" width="160" height="92" class="box event"/>
  <text x="489" y="324">Change feed</text><text x="481" y="348" class="label">durable sequence</text><text x="492" y="369" class="label">per namespace</text>
  <rect x="660" y="286" width="92" height="92" class="box event"/>
  <text x="670" y="324">Notify</text><text x="670" y="348" class="label">hint</text>
  <rect x="660" y="92" width="92" height="82" class="box api"/>
  <text x="670" y="126">Device B</text><text x="670" y="150" class="label">sync</text>

  <path d="M160 133 H228 M160 159 C280 238, 405 230, 465 159 M308 186 V286 M545 186 V260 H545 V286 M388 332 H465 M625 332 H660 M706 286 V174" class="arrow"/>
  <path d="M660 145 C575 230, 430 443, 160 164" class="arrow dashed"/>
  <text x="172" y="79" class="label">control plane</text><text x="324" y="238" class="label">data plane: bytes bypass API</text>
  <text x="396" y="272" class="label">completion and outbox</text><text x="558" y="410" class="label">sync plane</text>
  <text x="28" y="454" class="label">A notification prompts Device B to read its durable change feed and fetch only missing data.</text>
</svg>
