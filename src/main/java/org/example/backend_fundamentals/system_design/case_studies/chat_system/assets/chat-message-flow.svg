<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" role="img" aria-labelledby="title desc">
  <title id="title">Chat message acceptance, delivery, and recovery flow</title>
  <desc id="desc">The sender's request is deduplicated and durably appended before acknowledgement. A delivery worker routes the message to the recipient WebSocket owner. An offline notification is best effort, and a reconnecting device synchronizes durable history after its cursor.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; font-size: 18px; }
    .title { font-size: 24px; font-weight: 700; }
    .box { stroke: #475569; stroke-width: 2; rx: 8; }
    .client { fill: #dbeafe; } .server { fill: #fef3c7; } .store { fill: #fce7f3; }
    .worker { fill: #e0e7ff; } .recipient { fill: #dcfce7; } .offline { fill: #ffedd5; }
    .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 7 5; }
    .label { font-size: 15px; fill: #475569; }
    .small { font-size: 14px; fill: #475569; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>

  <text x="22" y="38" class="title">Message flow: durable acceptance first, recovery from history</text>

  <rect x="20" y="95" width="115" height="88" class="box client"/>
  <text x="40" y="130">Sender</text><text x="40" y="153">device</text><text x="32" y="173" class="small">clientMessageId</text>
  <rect x="160" y="85" width="140" height="108" class="box server"/>
  <text x="177" y="123">Sender chat</text><text x="192" y="147">server</text><text x="177" y="171" class="label">auth + dedupe</text>
  <rect x="330" y="85" width="165" height="108" class="box store"/>
  <text x="351" y="123">Append owner</text><text x="350" y="147">message + outbox</text><text x="363" y="171" class="label">durable order</text>
  <rect x="530" y="95" width="125" height="88" class="box worker"/>
  <text x="549" y="130">Delivery</text><text x="557" y="153">worker</text><text x="546" y="173" class="small">replay safe</text>

  <path d="M135 139 H160 M300 139 H330 M495 139 H530" class="arrow"/>
  <text x="38" y="78" class="label">SEND_MESSAGE</text>

  <path d="M412 193 V250 H230 V193" class="arrow dash"/>
  <text x="238" y="243" class="label">ACK after append</text>
  <path d="M230 193 V270 H77 V183" class="arrow dash"/>
  <text x="20" y="263" class="label">ACK(messageId)</text>

  <rect x="410" y="315" width="155" height="90" class="box recipient"/>
  <text x="433" y="350">Recipient chat</text><text x="458" y="374">server</text><text x="431" y="394" class="label">WebSocket owner</text>
  <rect x="605" y="315" width="135" height="90" class="box client"/>
  <text x="629" y="350">Recipient</text><text x="640" y="374">device</text><text x="621" y="394" class="label">cursor</text>
  <path d="M592 183 V270 H487 V315" class="arrow"/>
  <path d="M565 360 H605" class="arrow"/>
  <text x="502" y="258" class="label">lookup owner</text>

  <rect x="155" y="415" width="150" height="78" class="box offline"/>
  <text x="175" y="448">Notification</text><text x="190" y="473" class="label">offline only</text>
  <path d="M592 183 V455 H305" class="arrow dash"/>
  <text x="425" y="446" class="label">no active connection</text>

  <path d="M605 360 H515 V260 H412 V193" class="arrow dash"/>
  <text x="335" y="289" class="label">Reconnect: sync after this conversation's cursor</text>
  <text x="20" y="525" class="label">If ACK is lost, retrying the same clientMessageId returns the original messageId; recipient deduplicates it.</text>
</svg>
