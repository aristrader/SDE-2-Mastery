<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">File synchronization architecture</title>
  <desc id="desc">A client uses an API service for metadata and direct object storage for multipart bytes. Completion events update metadata and notify other device sync clients.</desc>
  <style>
    .box { stroke: #1f2937; stroke-width: 2; rx: 8; }
    .title { font: 600 18px Arial, sans-serif; fill: #111827; }
    .text { font: 14px Arial, sans-serif; fill: #1f2937; }
    .small { font: 12px Arial, sans-serif; fill: #374151; }
    .arrow { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 6 5; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs>
  <rect width="1100" height="520" fill="#f8fafc"/>
  <text x="42" y="42" class="title">Google Drive System Design</text>
  <rect x="50" y="100" width="180" height="76" class="box" fill="#dbeafe"/>
  <text x="88" y="132" class="title">Device A</text><text x="67" y="155" class="small">watcher + local cache</text>
  <rect x="335" y="82" width="220" height="105" class="box" fill="#e0f2fe"/>
  <text x="373" y="120" class="title">API / Metadata</text><text x="380" y="143" class="text">auth, versions, sessions</text><text x="383" y="164" class="small">returns direct authorization</text>
  <rect x="335" y="290" width="220" height="80" class="box" fill="#ede9fe"/>
  <text x="384" y="324" class="title">Metadata DB</text><text x="372" y="347" class="small">files, versions, permissions</text>
  <rect x="700" y="82" width="220" height="105" class="box" fill="#dcfce7"/>
  <text x="744" y="120" class="title">Object Storage</text><text x="731" y="143" class="text">multipart file blocks</text><text x="748" y="164" class="small">encrypted, replicated</text>
  <rect x="700" y="290" width="220" height="80" class="box" fill="#fef3c7"/>
  <text x="751" y="324" class="title">Event Worker</text><text x="726" y="347" class="small">complete version idempotently</text>
  <rect x="927" y="290" width="145" height="80" class="box" fill="#fee2e2"/>
  <text x="940" y="324" class="title">Notify</text><text x="943" y="347" class="small">FileChanged</text>
  <rect x="927" y="100" width="145" height="76" class="box" fill="#dbeafe"/>
  <text x="956" y="132" class="title">Device B</text><text x="946" y="155" class="small">sync client</text>
  <path d="M230 130 L325 130" class="arrow"/><text x="248" y="116" class="small">control plane</text>
  <path d="M230 155 C400 245, 560 225, 690 160" class="arrow dashed"/><text x="405" y="223" class="small">direct multipart bytes</text>
  <path d="M445 187 L445 280" class="arrow"/>
  <path d="M810 187 L810 280" class="arrow"/><text x="825" y="237" class="small">completion event</text>
  <path d="M700 330 L565 330" class="arrow"/>
  <path d="M920 330 L917 330" class="arrow"/>
  <path d="M999 290 L999 185" class="arrow"/><text x="1010" y="236" class="small">change hint</text>
  <path d="M927 148 C760 455, 400 455, 230 167" class="arrow dashed"/><text x="485" y="470" class="small">Device B fetches metadata and only missing blocks</text>
</svg>
