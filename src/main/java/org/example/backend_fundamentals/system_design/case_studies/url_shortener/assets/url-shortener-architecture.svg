<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">URL shortener architecture</title>
  <desc id="desc">Client traffic reaches a load balancer, stateless URL service, cache, database, ID generator, and async analytics pipeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #111827; }
      .box { fill: #f8fafc; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .store { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
      .queue { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8; }
      .line { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; fill: #4b5563; }
    </style>
  </defs>

  <rect x="32" y="70" width="130" height="76" class="box"/>
  <text x="97" y="103" text-anchor="middle" class="label">Client</text>
  <text x="97" y="126" text-anchor="middle" class="small">browser/app</text>

  <rect x="220" y="70" width="150" height="76" class="box"/>
  <text x="295" y="103" text-anchor="middle" class="label">Load</text>
  <text x="295" y="126" text-anchor="middle" class="small">balancer</text>

  <rect x="430" y="70" width="170" height="76" class="box"/>
  <text x="515" y="101" text-anchor="middle" class="label">URL service</text>
  <text x="515" y="124" text-anchor="middle" class="small">stateless API tier</text>

  <rect x="705" y="40" width="150" height="70" class="store"/>
  <text x="780" y="72" text-anchor="middle" class="label">Cache</text>
  <text x="780" y="94" text-anchor="middle" class="small">shortCode -> URL</text>

  <rect x="705" y="160" width="150" height="70" class="store"/>
  <text x="780" y="192" text-anchor="middle" class="label">Database</text>
  <text x="780" y="214" text-anchor="middle" class="small">source of truth</text>

  <rect x="430" y="220" width="170" height="70" class="store"/>
  <text x="515" y="252" text-anchor="middle" class="label">ID generator</text>
  <text x="515" y="274" text-anchor="middle" class="small">Snowflake-style</text>

  <rect x="220" y="300" width="150" height="70" class="queue"/>
  <text x="295" y="332" text-anchor="middle" class="label">Click events</text>
  <text x="295" y="354" text-anchor="middle" class="small">queue/stream</text>

  <rect x="430" y="300" width="170" height="70" class="queue"/>
  <text x="515" y="332" text-anchor="middle" class="label">Analytics</text>
  <text x="515" y="354" text-anchor="middle" class="small">async workers</text>

  <path d="M 162 108 L 220 108" class="line"/>
  <path d="M 370 108 L 430 108" class="line"/>
  <path d="M 600 94 L 705 75" class="line"/>
  <path d="M 600 128 L 705 188" class="line"/>
  <path d="M 515 146 L 515 220" class="line"/>
  <path d="M 430 130 C 350 160 310 230 295 300" class="line"/>
  <path d="M 370 335 L 430 335" class="line"/>
</svg>
