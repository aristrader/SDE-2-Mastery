<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="title desc">
  <title id="title">URL shortener architecture</title><desc id="desc">A stateless URL service creates durable mappings using an ID generator. Redirects are cache-first, fall back to the mapping store, and publish click events asynchronously.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172033;font-size:18px}.title{font-size:24px;font-weight:700}.box{stroke:#475569;stroke-width:2;rx:8}.api{fill:#dbeafe}.store{fill:#fce7f3}.event{fill:#e0e7ff}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 5}.label{font-size:15px;fill:#475569}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
  <text x="24" y="36" class="title">URL shortener: durable mapping, cache-first redirect</text>
  <rect x="25" y="95" width="120" height="80" class="box api"/><text x="55" y="130">Client</text><text x="48" y="154" class="label">create / redirect</text>
  <rect x="190" y="85" width="155" height="100" class="box api"/><text x="218" y="125">URL service</text><text x="210" y="150" class="label">stateless validation</text><text x="223" y="170" class="label">and lookup</text>
  <rect x="405" y="70" width="150" height="80" class="box store"/><text x="450" y="105">Cache</text><text x="430" y="130" class="label">hot mappings</text>
  <rect x="405" y="205" width="150" height="100" class="box store"/><text x="431" y="245">Mapping store</text><text x="424" y="270" class="label">durable source</text><text x="441" y="290" class="label">of truth</text>
  <rect x="615" y="205" width="135" height="100" class="box store"/><text x="633" y="245">ID generator</text><text x="638" y="270" class="label">create only</text>
  <rect x="405" y="365" width="150" height="80" class="box event"/><text x="429" y="400">Click queue</text><text x="422" y="425" class="label">after redirect</text>
  <rect x="615" y="365" width="135" height="80" class="box event"/><text x="639" y="400">Analytics</text><text x="637" y="425" class="label">asynchronous</text>
  <path d="M145 135 H190 M345 115 H405 M345 155 H380 V255 H405 M555 255 H615 M480 305 V365 M555 405 H615" class="arrow"/>
  <text x="350" y="58" class="label">redirect lookup</text><text x="565" y="190" class="label">create ID</text><text x="565" y="352" class="label">non-blocking</text>
  <text x="25" y="480" class="label">Cache and analytics optimize redirects; only the mapping store decides whether a link exists.</text>
</svg>
