<svg xmlns="http://www.w3.org/2000/svg" width="540" height="980" viewBox="0 0 540 980" role="img" aria-labelledby="title desc">
  <title id="title">Top-K heavy hitters event and read flow</title>
  <desc id="desc">Events flow through a partitioned stream and window aggregation to a top-K snapshot. The ranking API serves the precomputed snapshot to clients.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#334155"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.label{font-size:21px;font-weight:700}.body{font-size:16px}.box{stroke:#334155;stroke-width:2.5;rx:9}.arrow{stroke:#334155;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="540" height="980" fill="#f8fafc"/>
  <text x="270" y="45" text-anchor="middle" class="title">Write path: compute before reads</text>
  <rect x="70" y="80" width="400" height="92" class="box" fill="#dbeafe"/>
  <text x="270" y="117" text-anchor="middle" class="label">Source product</text><text x="270" y="144" text-anchor="middle" class="body">publishes ItemEvent</text>
  <line x1="270" y1="172" x2="270" y2="220" class="arrow"/>
  <rect x="70" y="220" width="400" height="105" class="box" fill="#e0f2fe"/>
  <text x="270" y="260" text-anchor="middle" class="label">Durable event stream</text><text x="270" y="288" text-anchor="middle" class="body">partition key = item ID; retained for replay</text>
  <line x1="270" y1="325" x2="270" y2="373" class="arrow"/>
  <rect x="70" y="373" width="400" height="122" class="box" fill="#dcfce7"/>
  <text x="270" y="414" text-anchor="middle" class="label">Window aggregators</text><text x="270" y="442" text-anchor="middle" class="body">event time, dedupe, checkpointed counts</text><text x="270" y="466" text-anchor="middle" class="body">emit local top-M candidates</text>
  <line x1="270" y1="495" x2="270" y2="543" class="arrow"/>
  <rect x="70" y="543" width="400" height="105" class="box" fill="#fef3c7"/>
  <text x="270" y="583" text-anchor="middle" class="label">Top-K publisher</text><text x="270" y="611" text-anchor="middle" class="body">merge candidates into one ranked snapshot</text>
  <line x1="270" y1="648" x2="270" y2="696" class="arrow"/>
  <rect x="70" y="696" width="400" height="72" class="box" fill="#fee2e2"/>
  <text x="270" y="728" text-anchor="middle" class="label">Durable TopKSnapshot</text><text x="270" y="752" text-anchor="middle" class="body">rebuildable ranked answer</text>
  <line x1="270" y1="768" x2="270" y2="804" class="arrow"/>
  <rect x="70" y="804" width="400" height="60" class="box" fill="#fef3c7"/>
  <text x="270" y="842" text-anchor="middle" class="label">Cache: active snapshot version</text>
  <text x="270" y="898" text-anchor="middle" class="title">Read path: serve the published version</text>
  <rect x="35" y="915" width="140" height="48" class="box" fill="#f3e8ff"/><text x="105" y="946" text-anchor="middle" class="body">Client</text>
  <rect x="200" y="915" width="140" height="48" class="box" fill="#ede9fe"/><text x="270" y="946" text-anchor="middle" class="body">Ranking API</text>
  <rect x="365" y="915" width="140" height="48" class="box" fill="#fef3c7"/><text x="435" y="946" text-anchor="middle" class="body">Cache</text>
  <line x1="175" y1="939" x2="200" y2="939" class="arrow"/><line x1="340" y1="939" x2="365" y2="939" class="arrow"/>
  <text x="270" y="978" text-anchor="middle" class="body">Cache miss refills from durable snapshot; API never scans events.</text>
</svg>
