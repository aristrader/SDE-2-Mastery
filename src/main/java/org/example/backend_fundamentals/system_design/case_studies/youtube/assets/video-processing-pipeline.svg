<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Video processing publishes only complete output</title>
  <desc id="desc">A durable source creates one processing job. Validation releases parallel output tasks. A verifier checks the immutable output version before a conditional READY publish makes it available to CDN playback.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.d{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:8}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:8}.p{fill:#f0fdf4;stroke:#15803d;stroke-width:2;rx:8}.l{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}.t{font-size:18px;font-weight:700}.s{font-size:17px;fill:#475569}.h{font-size:21px;font-weight:800}</style></defs>
  <text x="38" y="34" class="h">Processing: verify one immutable version before publish</text>
  <rect x="38" y="62" width="190" height="70" class="d"/><text x="133" y="91" text-anchor="middle" class="t">Source object</text><text x="133" y="114" text-anchor="middle" class="s">verified upload version</text>
  <rect x="286" y="62" width="190" height="70" class="d"/><text x="381" y="91" text-anchor="middle" class="t">Durable job</text><text x="381" y="114" text-anchor="middle" class="s">video + attempt</text>
  <rect x="534" y="62" width="190" height="70" class="b"/><text x="629" y="91" text-anchor="middle" class="t">Validate + segment</text><text x="629" y="114" text-anchor="middle" class="s">release safe tasks</text>
  <path d="M228 97L286 97" class="l"/><path d="M476 97L534 97" class="l"/>
  <text x="38" y="190" class="h">Parallel tasks write the same isolated output version</text>
  <rect x="52" y="220" width="145" height="65" class="b"/><text x="124" y="248" text-anchor="middle" class="t">Video encode</text><text x="124" y="270" text-anchor="middle" class="s">renditions</text>
  <rect x="225" y="220" width="145" height="65" class="b"/><text x="298" y="248" text-anchor="middle" class="t">Audio encode</text><text x="298" y="270" text-anchor="middle" class="s">tracks</text>
  <rect x="398" y="220" width="145" height="65" class="b"/><text x="470" y="248" text-anchor="middle" class="t">Thumbnails</text><text x="470" y="270" text-anchor="middle" class="s">and policy checks</text>
  <rect x="571" y="220" width="145" height="65" class="d"/><text x="644" y="248" text-anchor="middle" class="t">Output version</text><text x="644" y="270" text-anchor="middle" class="s">segments + manifest</text>
  <path d="M629 132C629 180 124 175 124 220" class="l"/><path d="M629 132C629 180 298 175 298 220" class="l"/><path d="M629 132C629 180 470 175 470 220" class="l"/><path d="M197 252L571 252" class="l"/><path d="M370 270L571 270" class="l"/><path d="M543 252L571 252" class="l"/>
  <text x="38" y="355" class="h">One conditional publish controls viewer eligibility</text>
  <rect x="150" y="385" width="190" height="70" class="p"/><text x="245" y="414" text-anchor="middle" class="t">Verify outputs</text><text x="245" y="437" text-anchor="middle" class="s">required set is complete</text>
  <rect x="420" y="385" width="190" height="70" class="p"/><text x="515" y="414" text-anchor="middle" class="t">Conditional READY</text><text x="515" y="437" text-anchor="middle" class="s">activate this version</text>
  <path d="M644 285C644 340 245 335 245 385" class="l"/><path d="M340 420L420 420" class="l"/>
  <path d="M515 455V490H650" class="l"/><text x="535" y="506" class="s">CDN serves active version</text>
</svg>
