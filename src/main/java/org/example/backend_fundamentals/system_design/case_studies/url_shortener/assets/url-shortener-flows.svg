<svg xmlns="http://www.w3.org/2000/svg" width="780" height="490" viewBox="0 0 780 490" role="img" aria-labelledby="title desc">
  <title id="title">URL shortener create and redirect flows</title><desc id="desc">Creation validates a URL, allocates a unique ID, base62 encodes it, and durably stores the mapping. Redirects first check cache, then read and backfill the mapping store on a miss before redirecting and asynchronously publishing analytics.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172033;font-size:18px}.title{font-size:24px;font-weight:700}.box{stroke:#475569;stroke-width:2;rx:8}.create{fill:#fef3c7}.read{fill:#dbeafe}.store{fill:#fce7f3}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 5}.label{font-size:15px;fill:#475569}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker></defs>
  <text x="22" y="36" class="title">Create: unique ID before base62</text>
  <rect x="25" y="70" width="135" height="82" class="box create"/><text x="51" y="104">Validate URL</text><text x="44" y="129" class="label">scheme + quota</text>
  <rect x="205" y="70" width="145" height="82" class="box create"/><text x="224" y="104">Allocate ID</text><text x="224" y="129" class="label">globally unique</text>
  <rect x="395" y="70" width="145" height="82" class="box create"/><text x="427" y="104">Base62</text><text x="414" y="129" class="label">compact code</text>
  <rect x="585" y="70" width="150" height="82" class="box store"/><text x="612" y="104">Store mapping</text><text x="599" y="129" class="label">unique code guard</text>
  <path d="M160 111 H205 M350 111 H395 M540 111 H585" class="arrow"/>
  <text x="22" y="222" class="title">Redirect: cache first, analytics after response</text>
  <rect x="25" y="260" width="135" height="82" class="box read"/><text x="52" y="294">GET /code</text><text x="48" y="319" class="label">resolve alias</text>
  <rect x="205" y="260" width="145" height="82" class="box read"/><text x="240" y="294">Cache</text><text x="224" y="319" class="label">hit: redirect</text>
  <rect x="395" y="260" width="145" height="82" class="box store"/><text x="430" y="294">Mapping store</text><text x="414" y="319" class="label">miss: read/backfill</text>
  <rect x="585" y="260" width="150" height="82" class="box read"/><text x="618" y="294">Redirect</text><text x="600" y="319" class="label">then emit click</text>
  <path d="M160 301 H205 M350 301 H395 M540 301 H585" class="arrow"/>
  <path d="M277 260 C330 212 540 212 660 260" class="arrow dash"/><text x="401" y="207" class="label">hit skips store</text>
  <text x="25" y="413" class="label">Unknown/expired mappings return a stated error; analytics failure never changes a successful redirect.</text>
</svg>
