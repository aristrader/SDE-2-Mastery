<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" role="img" aria-labelledby="title desc">
  <title id="title">News feed publish and read architecture</title>
  <desc id="desc">A post and outbox event are committed together, then normal-author fanout materializes durable feed entries. Reads combine cached or durable feed IDs with high-fanout author posts before hydration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .panel { fill:#f8fafc; stroke:#94a3b8; stroke-width:2; rx:10; }
      .box { fill:#fff; stroke:#334155; stroke-width:2; rx:8; }
      .write { fill:#ecfdf5; } .read { fill:#e0f2fe; } .queue { fill:#fff7ed; } .data { fill:#f5f3ff; }
      .title { font:700 18px Arial,sans-serif; fill:#0f172a; } .label { font:700 15px Arial,sans-serif; fill:#0f172a; }
      .small { font:13px Arial,sans-serif; fill:#334155; } .line { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#64748b; stroke-width:2; stroke-dasharray:6 5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="20" y="18" width="680" height="276" class="panel write"/>
  <text x="42" y="48" class="title">Publish: accept once, materialize later</text>

  <rect x="42" y="84" width="126" height="70" class="box"/>
  <text x="105" y="113" text-anchor="middle" class="label">Client</text><text x="105" y="135" text-anchor="middle" class="small">post + idempotency key</text>
  <rect x="221" y="84" width="145" height="70" class="box write"/>
  <text x="294" y="113" text-anchor="middle" class="label">Post service</text><text x="294" y="135" text-anchor="middle" class="small">auth + validation</text>
  <rect x="419" y="84" width="145" height="70" class="box data"/>
  <text x="492" y="113" text-anchor="middle" class="label">Post + outbox</text><text x="492" y="135" text-anchor="middle" class="small">one durable transaction</text>
  <path d="M168 119 H221" class="line"/><path d="M366 119 H419" class="line"/>

  <rect x="70" y="203" width="142" height="64" class="box queue"/>
  <text x="141" y="230" text-anchor="middle" class="label">Fanout event</text><text x="141" y="250" text-anchor="middle" class="small">outbox relay</text>
  <rect x="289" y="203" width="142" height="64" class="box"/>
  <text x="360" y="230" text-anchor="middle" class="label">Graph + policy</text><text x="360" y="250" text-anchor="middle" class="small">followers + visibility</text>
  <rect x="508" y="203" width="142" height="64" class="box data"/>
  <text x="579" y="230" text-anchor="middle" class="label">Feed entries</text><text x="579" y="250" text-anchor="middle" class="small">viewer, post, sort key</text>
  <path d="M492 154 V183 Q492 203 431 203" class="line"/>
  <path d="M212 235 H289" class="line"/><path d="M431 235 H508" class="line"/>
  <text x="520" y="183" class="small">normal authors only</text>

  <rect x="20" y="326" width="680" height="312" class="panel read"/>
  <text x="42" y="356" class="title">Read: select IDs, then hydrate the visible page</text>
  <rect x="42" y="392" width="126" height="70" class="box"/>
  <text x="105" y="421" text-anchor="middle" class="label">Client</text><text x="105" y="443" text-anchor="middle" class="small">cursor + page size</text>
  <rect x="221" y="392" width="145" height="70" class="box read"/>
  <text x="294" y="421" text-anchor="middle" class="label">Feed service</text><text x="294" y="443" text-anchor="middle" class="small">merge and filter</text>
  <rect x="419" y="392" width="145" height="70" class="box data"/>
  <text x="492" y="421" text-anchor="middle" class="label">Feed IDs</text><text x="492" y="443" text-anchor="middle" class="small">cache or durable index</text>
  <path d="M168 427 H221" class="line"/><path d="M366 427 H419" class="line"/>

  <rect x="70" y="520" width="150" height="72" class="box queue"/>
  <text x="145" y="549" text-anchor="middle" class="label">High-fanout posts</text><text x="145" y="571" text-anchor="middle" class="small">merge at read time</text>
  <rect x="285" y="520" width="150" height="72" class="box data"/>
  <text x="360" y="549" text-anchor="middle" class="label">Hydration stores</text><text x="360" y="571" text-anchor="middle" class="small">post, user, action, count</text>
  <rect x="500" y="520" width="150" height="72" class="box"/>
  <text x="575" y="549" text-anchor="middle" class="label">Response + CDN</text><text x="575" y="571" text-anchor="middle" class="small">metadata and media URLs</text>
  <path d="M294 462 V490 Q294 520 220 520" class="dash"/>
  <path d="M492 462 V490 Q492 520 435 520" class="line"/>
  <path d="M435 556 H500" class="line"/><path d="M220 556 Q250 556 285 556" class="line"/>
</svg>
