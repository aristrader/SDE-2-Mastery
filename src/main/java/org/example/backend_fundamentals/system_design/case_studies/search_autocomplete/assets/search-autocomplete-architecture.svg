<svg xmlns="http://www.w3.org/2000/svg" width="940" height="590" viewBox="0 0 940 590" role="img" aria-labelledby="title desc">
  <title id="title">Search autocomplete ownership and workload paths</title>
  <desc id="desc">A fast read path uses a policy check and in-memory prefix index, while a separate durable event and snapshot pipeline creates the next index version without interrupting reads.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; font-size: 16px; }
    .title { font-size: 23px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #475569; }
    .box { stroke: #475569; stroke-width: 2; rx: 8; }
    .read { fill: #dbeafe; } .compute { fill: #e0e7ff; } .durable { fill: #fce7f3; }
    .memory { fill: #fef3c7; } .policy { fill: #ffedd5; }
    .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 8 5; } .small { font-size: 14px; fill: #475569; }
    .strong { font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
  </defs>
  <text x="35" y="38" class="title">Search autocomplete: durable ranking build, replaceable fast reads</text>
  <text x="35" y="82" class="strong">Read path — answer a typed prefix from the active version</text>
  <rect x="35" y="105" width="130" height="76" class="box read"/>
  <text x="72" y="139">Client</text><text x="53" y="162" class="small">debounce + cancel</text>
  <rect x="225" y="105" width="145" height="76" class="box read"/>
  <text x="251" y="139">Autocomplete API</text><text x="248" y="162" class="small">normalize + route</text>
  <rect x="430" y="105" width="165" height="76" class="box memory"/>
  <text x="459" y="139">Active prefix index</text><text x="455" y="162" class="small">RAM: v42 or v43</text>
  <rect x="655" y="105" width="125" height="76" class="box policy"/>
  <text x="686" y="139">Policy</text><text x="675" y="162" class="small">filter candidates</text>
  <path d="M165 143 H225 M370 143 H430 M595 143 H655" class="arrow"/>
  <text x="35" y="215" class="small">The API returns the stored top five. The in-memory index is fast but replaceable; it is not the source of truth.</text>
  <text x="35" y="286" class="strong">Build path — create and safely publish the next version</text>
  <rect x="35" y="310" width="135" height="78" class="box durable"/>
  <text x="57" y="344">Query event log</text><text x="55" y="367" class="small">durable events</text>
  <rect x="225" y="310" width="145" height="78" class="box compute"/>
  <text x="258" y="344">Aggregator</text><text x="244" y="367" class="small">windowed counts</text>
  <rect x="425" y="310" width="145" height="78" class="box compute"/>
  <text x="456" y="344">Builder</text><text x="445" y="367" class="small">top-K per prefix</text>
  <rect x="625" y="310" width="155" height="78" class="box durable"/>
  <text x="645" y="344">Snapshot store</text><text x="642" y="367" class="small">validated v43</text>
  <path d="M170 349 H225 M370 349 H425 M570 349 H625" class="arrow"/>
  <path d="M702 310 V250 H512 V181" class="arrow dash"/>
  <text x="720" y="250" class="small">background load, warm,</text><text x="720" y="270" class="small">then atomic promotion</text>
  <rect x="35" y="455" width="745" height="78" class="box memory"/>
  <text x="58" y="487" class="strong">Promotion rule</text>
  <text x="58" y="512" class="small">Keep serving the last validated version while the new artifact loads. If validation or loading fails, retain the old version and alert.</text>
  <text x="35" y="568" class="small">Shard map: route a prefix range to its balanced index shard; split a hot range deeper instead of hashing the full query.</text>
</svg>
