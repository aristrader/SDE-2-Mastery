<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
  <title id="title">On-demand video control and data planes</title>
  <desc id="desc">Creators use the video API to create durable upload state then upload bytes directly to source storage. A durable processing job publishes an immutable output version. Viewers authorize through the API and retrieve manifest and segments from CDN or output storage.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:8}.d{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:8}.p{fill:#f0fdf4;stroke:#15803d;stroke-width:2;rx:8}.l{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}.t{font-size:16px;font-weight:700}.s{font-size:13px;fill:#475569}.h{font-size:19px;font-weight:800}</style></defs>
  <text x="45" y="38" class="h">Control plane: create, publish, and authorize</text>
  <rect x="45" y="65" width="150" height="70" class="b"/><text x="120" y="95" text-anchor="middle" class="t">Creator / viewer</text><text x="120" y="117" text-anchor="middle" class="s">small API requests</text>
  <rect x="270" y="65" width="165" height="70" class="b"/><text x="352" y="95" text-anchor="middle" class="t">Video API</text><text x="352" y="117" text-anchor="middle" class="s">session, status, auth</text>
  <rect x="510" y="65" width="180" height="70" class="d"/><text x="600" y="95" text-anchor="middle" class="t">Video metadata</text><text x="600" y="117" text-anchor="middle" class="s">video, job, active version</text>
  <rect x="765" y="65" width="165" height="70" class="p"/><text x="848" y="95" text-anchor="middle" class="t">Policy / cache</text><text x="848" y="117" text-anchor="middle" class="s">derived fast reads</text>
  <path d="M195 100L270 100" class="l"/><path d="M435 100L510 100" class="l"/><path d="M690 100L765 100" class="l"/>
  <text x="45" y="210" class="h">Data plane: bytes bypass the API tier</text>
  <rect x="45" y="240" width="165" height="75" class="d"/><text x="127" y="271" text-anchor="middle" class="t">Source storage</text><text x="127" y="293" text-anchor="middle" class="s">multipart upload bytes</text>
  <rect x="300" y="240" width="180" height="75" class="d"/><text x="390" y="271" text-anchor="middle" class="t">Durable job</text><text x="390" y="293" text-anchor="middle" class="s">source version + attempt</text>
  <rect x="570" y="240" width="175" height="75" class="b"/><text x="658" y="271" text-anchor="middle" class="t">Processing workers</text><text x="658" y="293" text-anchor="middle" class="s">validate, encode, package</text>
  <rect x="810" y="240" width="150" height="75" class="d"/><text x="885" y="271" text-anchor="middle" class="t">Output version</text><text x="885" y="293" text-anchor="middle" class="s">segments + manifest</text>
  <path d="M352 135C352 190 127 185 127 240" class="l"/><path d="M210 277L300 277" class="l"/><path d="M480 277L570 277" class="l"/><path d="M745 277L810 277" class="l"/><path d="M885 240C885 180 600 185 600 135" class="l"/>
  <text x="45" y="380" class="h">Playback: authorize once, stream segments from the edge</text>
  <rect x="350" y="400" width="165" height="55" class="p"/><text x="432" y="433" text-anchor="middle" class="t">CDN edge</text>
  <rect x="655" y="400" width="170" height="55" class="b"/><text x="740" y="433" text-anchor="middle" class="t">Viewer player</text>
  <path d="M810 315C810 370 432 365 432 400" class="l"/><path d="M515 427L655 427" class="l"/>
</svg>
