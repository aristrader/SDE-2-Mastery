<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">System design interview four-step flow</title>
  <desc id="desc">Clarify scope, propose high-level design, deep dive, then wrap up.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .focus { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; rx: 8; }
      .text { font: 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
  </defs>

  <rect x="30" y="60" width="190" height="115" class="box"/>
  <text x="125" y="95" text-anchor="middle" class="text">1. Clarify</text>
  <text x="125" y="122" text-anchor="middle" class="small">features, scale,</text>
  <text x="125" y="142" text-anchor="middle" class="small">constraints, assumptions</text>

  <path d="M220 118 H270" class="arrow"/>

  <rect x="280" y="60" width="190" height="115" class="box"/>
  <text x="375" y="95" text-anchor="middle" class="text">2. HLD</text>
  <text x="375" y="122" text-anchor="middle" class="small">boxes, flows,</text>
  <text x="375" y="142" text-anchor="middle" class="small">estimates, buy-in</text>

  <path d="M470 118 H520" class="arrow"/>

  <rect x="530" y="60" width="190" height="115" class="focus"/>
  <text x="625" y="95" text-anchor="middle" class="text">3. Deep dive</text>
  <text x="625" y="122" text-anchor="middle" class="small">critical bottleneck,</text>
  <text x="625" y="142" text-anchor="middle" class="small">tradeoffs, failure modes</text>

  <path d="M720 118 H770" class="arrow"/>

  <rect x="780" y="60" width="170" height="115" class="box"/>
  <text x="865" y="95" text-anchor="middle" class="text">4. Wrap up</text>
  <text x="865" y="122" text-anchor="middle" class="small">recap, risks,</text>
  <text x="865" y="142" text-anchor="middle" class="small">monitoring, next scale</text>

  <text x="490" y="215" text-anchor="middle" class="small">Ask for feedback before deep diving; the interviewer may want a different branch.</text>
</svg>
